version: "3.9"

services:
  # ============================================
  # Production (Pull Image from GHCR)
  # docker compose up -d
  # ============================================
  app:
    image: ghcr.io/rizkikotet-dev/rizkimotor-pos-nexjs:main
    container_name: rizki-motor
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/prod.db}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    profiles:
      - default

  # ============================================
  # Production (Build Local)
  # docker compose --profile build up -d
  # ============================================
  build:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rizki-motor-build
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/prod.db}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    profiles:
      - build

  # ============================================
  # Development (Hot Reload)
  # docker compose --profile dev up -d
  # ============================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps

    container_name: rizki-motor-dev
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      DATABASE_URL: ${DEV_DATABASE_URL:-file:/app/data/dev.db}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SKIP_ENV_VALIDATION: "1"

    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
      - .:/app
      - /app/node_modules
      - /app/.next

    command: >
      sh -c "
        node prisma/prepare.js &&
        npx prisma generate --schema=prisma/schema.prepared.prisma &&
        npx prisma db push --schema=prisma/schema.prepared.prisma &&
        node prisma/seed.js &&
        npm run dev
      "

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    profiles:
      - dev