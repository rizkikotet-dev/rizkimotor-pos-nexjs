services:
  # === Production (pull from GHCR) ===
  # Jalankan: docker compose up -d
  app:
    image: ghcr.io/rizkikotet-dev/rizkimotor-pos-nexjs:main
    container_name: rizki-motor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-production-secret
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - default

  # === Production (build local) ===
  # Jalankan: docker compose --profile build up -d
  build:
    build: .
    container_name: rizki-motor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-production-secret
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - build

  # === Development (hot reload) ===
  # Jalankan: docker compose --profile dev up -d
  # Akses: http://localhost:3000
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: rizki-motor-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/dev.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-rizki-motor
      - SKIP_ENV_VALIDATION=1
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
      - .:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma db push &&
        npm run dev
      "
    profiles:
      - dev
