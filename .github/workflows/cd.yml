name: CD — Deploy to Staging

on:
  workflow_run:
    workflows: ["Build & Push to DockerHub & GHCR"]
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write

env:
  STAGING_IMAGE: ghcr.io/rizkikotet-dev/rizkimotor-pos-nexjs:main

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull staging image
        run: docker pull ${{ env.STAGING_IMAGE }}

      - name: Deploy to staging
        run: |
          docker compose -f docker-compose.staging.yml up -d --remove-orphans
          echo "Waiting for container to start..."
          sleep 10

      - name: Run smoke tests
        run: |
          URL="http://localhost:3001"
          echo "Running smoke tests against $URL"

          # Wait for health check
          echo "Waiting for app to be ready..."
          for i in {1..30}; do
            if curl -sf "$URL/api/health" | grep -q '"healthy"'; then
              echo "✓ App is healthy"
              break
            fi
            echo "  Attempt $i/30..."
            sleep 5
          done

          sleep 3

          # Main page
          echo "Test 1: Main page"
          for i in {1..5}; do
            if curl -sf "$URL" | grep -qi "RIZKI MOTOR"; then
              echo "✓ Main page loads"
              break
            fi
            echo "  Retry $i/5..."
            sleep 3
          done
          if ! curl -sf "$URL" | grep -qi "RIZKI MOTOR"; then
            echo "✗ Main page failed"
            docker compose -f docker-compose.staging.yml logs --tail=30
            exit 1
          fi

          # Login page
          echo "Test 2: Login page"
          if curl -sf "$URL/login" | grep -qi "Login"; then
            echo "✓ Login page accessible"
          else
            echo "✗ Login page failed"
            exit 1
          fi

          # API routes
          echo "Test 3: API routes"
          if curl -sf "$URL/api/products" > /dev/null 2>&1; then
            echo "✓ API routes respond"
          else
            echo "✗ API routes failed"
            exit 1
          fi

          echo "All smoke tests passed! ✓"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.staging.yml logs --tail=50

  cleanup:
    name: Cleanup old images
    needs: deploy-staging
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Remove unused images
        run: docker image prune -f --filter "until=24h" || true
