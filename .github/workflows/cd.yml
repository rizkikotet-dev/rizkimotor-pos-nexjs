name: CD — Deploy to Staging

on:
  workflow_run:
    workflows: ["Build & Push to DockerHub & GHCR"]
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  packages: read
  id-token: write

env:
  STAGING_IMAGE: ghcr.io/rizkikotet-dev/rizkimotor-pos-nexjs:main
  STAGING_COMPOSE_FILE: docker-compose.staging.yml

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download docker-compose.staging.yml
        run: |
          cat << 'EOF' > docker-compose.staging.yml
          services:
            app:
              image: ${{ env.STAGING_IMAGE }}
              container_name: rizki-motor-staging
              restart: unless-stopped
              ports:
                - "3001:3000"
              environment:
                - DATABASE_URL=file:/app/data/staging.db
                - NEXTAUTH_URL=${{ secrets.STAGING_NEXTAUTH_URL || 'http://staging.rizki-motor.local:3001' }}
                - NEXTAUTH_SECRET=${{ secrets.STAGING_NEXTAUTH_SECRET }}
                - NODE_ENV=production
              volumes:
                - staging-data:/app/data
                - staging-uploads:/app/public/uploads
              healthcheck:
                test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 15s

          volumes:
            staging-data:
            staging-uploads:
          EOF

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull staging image
        run: docker pull ${{ env.STAGING_IMAGE }}

      - name: Deploy to staging (docker compose)
        run: |
          docker compose -f docker-compose.staging.yml up -d --remove-orphans
          echo "Waiting for staging to be healthy..."
          for i in {1..30}; do
            if docker compose -f docker-compose.staging.yml ps | grep -q "healthy"; then
              echo "Staging is healthy!"
              break
            fi
            sleep 5
          done

      - name: Run smoke tests
        run: |
          STAGING_URL="http://localhost:3001"
          echo "Running smoke tests against $STAGING_URL"
          
          # Test 1: Health check endpoint
          echo "Test 1: Health check"
          for i in {1..10}; do
            if curl -sf "$STAGING_URL/api/health" > /dev/null 2>&1; then
              echo "✓ Health check passed"
              break
            fi
            sleep 3
          done
          
          # Test 2: Main page loads
          echo "Test 2: Main page"
          if curl -sf "$STAGING_URL" | grep -qi "RIZKI MOTOR"; then
            echo "✓ Main page loads correctly"
          else
            echo "✗ Main page failed"
            exit 1
          fi
          
          # Test 3: Login page accessible
          echo "Test 3: Login page"
          if curl -sf "$STAGING_URL/login" | grep -qi "Login"; then
            echo "✓ Login page accessible"
          else
            echo "✗ Login page failed"
            exit 1
          fi
          
          # Test 4: API routes respond
          echo "Test 4: API routes"
          if curl -sf "$STAGING_URL/api/products" > /dev/null 2>&1; then
            echo "✓ API routes respond"
          else
            echo "✗ API routes failed"
            exit 1
          fi
          
          echo "All smoke tests passed! ✓"

      - name: Notify staging deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment successful"
            echo "Staging URL: ${{ secrets.STAGING_NEXTAUTH_URL || 'http://staging.rizki-motor.local:3001' }}"
          else
            echo "❌ Staging deployment failed"
            # Show logs for debugging
            docker compose -f docker-compose.staging.yml logs --tail=50
          fi

  # Optional: Cleanup old staging images
  cleanup:
    name: Cleanup old images
    needs: deploy-staging
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Remove unused images
        run: |
          docker image prune -f --filter "until=24h" || true